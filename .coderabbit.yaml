# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 配置 — goink-skills 社区仓库

language: zh-CN

reviews:
  profile: quiet
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

  path_filters:
    - "!**/scripts/**"
    - "!**/.template/**"
    - "!**/.github/**"
    - "!**/*.py"
    - "!**/*.json"
    - "!LICENSE"
    - "!CONTRIBUTING.md"
    - "!README*.md"

  path_instructions:
    - path: "skills/*.md"
      instructions: |
        - 审查全文合规性：违法内容（色情/暴力/政治敏感/诽谤）、广告/商业外链、诱导违法——发现即标记。
        - 大段连续原文（重点）：skill 出现 80 字以上连续原文片段（常见于"原文锚点""示例""范例"章节，带具体情节/角色/描写），请标记并提醒维护者合并前确认提交者拥有相应内容的使用授权。
        - 具体作品内容信号：正文出现 3 个以上具体人名 + 具体设定（异能/兵器/门派等）组合时，请标记并提醒维护者合并前确认提交者拥有相应内容的使用授权。
        - 不评价方法论质量。合规无问题时只留一句简短结论（如"已审查，合规无问题"），不展开。所有评论用中文。

chat:
  auto_reply: false
