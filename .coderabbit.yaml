# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 配置 — goink-skills 社区仓库

language: zh-CN
tone_instructions: 用友好的提醒语气，不要指责或命令式。提建议而非下指令，例如用"建议合并前确认授权"而非"必须移除"。

reviews:
  profile: quiet
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true

  tools:
    languagetool:
      enabled: false

  path_filters:
    - "!**/scripts/**"
    - "!**/.template/**"
    - "!**/.github/**"
    - "!**/*.py"
    - "!**/*.json"
    - "!LICENSE"
    - "!CONTRIBUTING.md"
    - "!README*.md"

  path_instructions:
    - path: "skills/*.md"
      instructions: |
        背景：goink-skills 是 Goink AI 写作工具的社区 skill 仓库，接受社区贡献的写作风格、叙事模式等 skill（Markdown 文件）。审查目标是合规性（违法、广告、疑似侵权），不评价方法论质量。发现疑似侵权内容时，提醒维护者合并前确认授权，不预设提交者侵权。

        - 审查全文合规性：违法内容（色情/暴力/政治敏感/诽谤）、广告/商业外链、诱导违法——发现即标记。注意区分"小说常规描写"与"真正的违法内容"：言情/武侠打斗/玄幻斗法/战场厮杀/架空政治等正常小说情节不算违法；只有渲染色情、血腥虐待、极端暴力、现实政治敏感人物或事件的具体描写才标记。
        - 大段连续原文（重点）：skill 出现 80 字以上连续原文片段（常见于"原文锚点""示例""范例"章节，带具体情节/角色/描写），请标记并提醒维护者合并前确认提交者拥有相应内容的使用授权。
        - 具体作品内容信号：正文出现 3 个以上具体人名 + 具体设定（异能/兵器/门派等）组合时，请标记并提醒维护者合并前确认提交者拥有相应内容的使用授权。
        - 不评价方法论质量。合规无问题时只留一句简短结论（如"已审查，合规无问题"），不展开。所有评论用中文。

chat:
  auto_reply: false
