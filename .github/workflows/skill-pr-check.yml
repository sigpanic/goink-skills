name: Skill PR Check

# SECURITY: This workflow uses pull_request_target which runs with the base
# branch's token and write permissions. Do NOT checkout PR code or execute
# PR-contributed scripts — that would be an RCE. The current implementation
# only fetches PR file contents via the read-only GitHub API and passes them
# as data to repository-owned scripts. See:
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/

      - name: Guard
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # --- internal PR check ---
          HEAD_REPO_ID="${{ github.event.pull_request.head.repo.id }}"
          BASE_REPO_ID="${{ github.event.pull_request.base.repo.id }}"
          if [ "$HEAD_REPO_ID" = "$BASE_REPO_ID" ]; then
            echo "Internal PR — skipping skill guard"
            exit 0
          fi

          echo "Fork PR detected — checking file paths"

          # --- fetch changed files (abort on API error to avoid silent approval) ---
          FILES=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json files --jq '.files[].path' 2>/dev/null)
          if [ $? -ne 0 ] || [ -z "$FILES" ]; then
            echo "Failed to fetch PR files from GitHub API — aborting to prevent silent approval"
            exit 1
          fi

          # --- path guard: only skills/*.md allowed (comment + label, do NOT close) ---
          # 拒绝 skills/ 外的文件 + skills/ 下非 .md 的文件
          DISALLOWED=$(echo "$FILES" | grep -v '^skills/.*\.md$' || true)
          if [ -n "$DISALLOWED" ]; then
            echo "Disallowed files detected (outside skills/ or non-.md under skills/):"
            echo "$DISALLOWED"

            FILE_LIST=$(echo "$DISALLOWED" | sed 's/^/- `/' | sed 's/$/`/')

            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<EOF
          ## 📁 文件位置提醒

          贡献 skill 请放到 \`skills/\` 目录下，每个 skill 是一个 \`.md\` 文件。以下文件不符合这个规则：

          ${FILE_LIST}

          调整后重新推送即可，参考 [贡献指南](https://github.com/${REPO}/blob/${DEFAULT_BRANCH}/CONTRIBUTING.md)。

          ---

          Please place skill contributions under \`skills/\` as \`.md\` files. The following files don't fit:

          ${FILE_LIST}

          Adjust and push again. See [contributing guide](https://github.com/${REPO}/blob/${DEFAULT_BRANCH}/CONTRIBUTING.md).
          EOF
            )"

            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label 'needs-revision' 2>/dev/null || true
            echo "PR has disallowed files — labeled needs-revision, not auto-closed"
            exit 1
          fi

          # --- validate skill frontmatter ---
          echo "All changes are within skills/"
          SKILL_FILES=$(echo "$FILES" | grep '^skills/.*\.md$' || true)
          VALIDATION_ERRORS=""

          fetch_content() {
            gh api "repos/${REPO}/contents/${1}?ref=${HEAD_SHA}" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null
          }

          # 拉取 main 分支已有 skill name 列表，传给 validate-skill.py 做重复 name 检查
          export EXISTING_NAMES=$(gh api "repos/${REPO}/contents/skills?ref=${DEFAULT_BRANCH}" --jq '[.[].name | rtrim_suffix(".md")] | join(",")' 2>/dev/null || true)

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Validating $file ..."
            expected=$(basename "$file" .md)
            content=$(fetch_content "$file")

            if [ -z "$content" ]; then
              VALIDATION_ERRORS="${VALIDATION_ERRORS}- \`${file}\`：无法读取文件内容"$'\n'
              continue
            fi

            if ! errs=$(printf '%s' "$content" | python3 scripts/validate-skill.py "$file" "$expected" 2>&1); then
              VALIDATION_ERRORS="${VALIDATION_ERRORS}${errs}"$'\n'
            fi
          done <<< "$SKILL_FILES"

          if [ -n "$VALIDATION_ERRORS" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<EOF
          ## 格式校验未通过

          请在本次 PR 中修改以下问题（PR 不会被关闭）：

          ${VALIDATION_ERRORS}
          参考 [贡献指南](https://github.com/${REPO}/blob/${DEFAULT_BRANCH}/CONTRIBUTING.md) 和 [模板](https://github.com/${REPO}/blob/${DEFAULT_BRANCH}/.template/skill.md)。

          ---

          Please fix the following issues in this PR (PR will not be closed):

          ${VALIDATION_ERRORS}
          See [contributing guide](https://github.com/${REPO}/blob/${DEFAULT_BRANCH}/CONTRIBUTING.md) and [template](https://github.com/${REPO}/blob/${DEFAULT_BRANCH}/.template/skill.md).
          EOF
            )"

            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label 'needs-revision' 2>/dev/null || true
            echo "Frontmatter validation failed — PR labeled needs-revision, left open"
            exit 1
          fi

          echo "All skill files validated OK"

          # --- success: 移除 needs-revision + 加 skill-contribution + 发通过评论（所有 action 统一）---
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label 'needs-revision' 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label 'skill-contribution' 2>/dev/null || true

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<EOF
          ## 感谢贡献！ 🎉

          格式校验通过，维护者将尽快 review。有建议会在 PR 里直接讨论。

          ---

          Thanks for the contribution! Your PR passed format checks. Maintainers will review it soon. Feedback will be posted here if any.
          EOF
          )"
